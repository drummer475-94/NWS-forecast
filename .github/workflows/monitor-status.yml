name: Monitor published NC status freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "8,38 * * * *"

permissions:
  contents: read

concurrency:
  group: nc-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check published snapshot age and integrity
        run: node scripts/check-nc-status.mjs
