<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWS Weather Dashboard</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header & Search -->
        <header class="glass-panel">
            <div class="logo">
                <i data-lucide="cloud-sun"></i>
                <h1>NWS Weather</h1>
            </div>
            <div class="search-container">
                <form id="search-form">
                    <input type="text" id="search-input" placeholder="Search city or zip code...">
                    <button type="submit" id="search-btn"><i data-lucide="search"></i></button>
                    <button type="button" id="geo-btn" title="Use My Location"><i data-lucide="navigation"></i></button>
                </form>
                <div id="search-error" class="error-msg hidden"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div id="loading-overlay" class="glass-panel hidden">
                <i data-lucide="loader-2" class="spinner"></i>
                <p>Loading weather data...</p>
            </div>

            <!-- Top Row: Current Conditions & Map -->
            <div class="top-row">
                <!-- Current Conditions -->
                <section id="current-conditions" class="glass-panel current-card hidden">
                    <h2 id="location-name">City Name</h2>
                    <div class="current-main">
                        <div class="temp-display">
                            <i id="current-icon" data-lucide="cloud"></i>
                            <span id="current-temp">--°</span>
                        </div>
                        <p id="current-desc" class="desc">Loading...</p>
                    </div>
                    <div class="current-details">
                        <div class="detail-item">
                            <i data-lucide="wind"></i>
                            <div>
                                <span>Wind</span>
                                <strong id="current-wind">--</strong>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="droplets"></i>
                            <div>
                                <span>Precip</span>
                                <strong id="current-precip">--%</strong>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="thermometer"></i>
                            <div>
                                <span>Feels Like</span>
                                <strong id="current-feels-like">--°</strong>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="droplet"></i>
                            <div>
                                <span>Humidity</span>
                                <strong id="current-humidity">--%</strong>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="thermometer-snowflake"></i>
                            <div>
                                <span>Dewpoint</span>
                                <strong id="current-dewpoint">--°</strong>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Radar Map -->
                <section class="glass-panel map-card">
                    <div class="card-header">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <h2>Live Radar</h2>
                            <span id="radar-time" class="radar-time">Loading...</span>
                        </div>
                        <div class="radar-controls">
                            <div class="btn-group">
                                <button type="button" id="toggle-map" class="toggle-btn active">Map</button>
                                <button type="button" id="toggle-sat" class="toggle-btn">Sat</button>
                            </div>
                            <button type="button" id="toggle-play" class="toggle-btn" title="Play/Pause"><i data-lucide="play"></i></button>
                        </div>
                    </div>
                    <div id="radar-map" class="map-container"></div>
                </section>
            </div>

            <!-- Bottom Row: 7-Day Forecast -->
            <section class="glass-panel forecast-card hidden" id="forecast-section">
                <h2>7-Day Forecast</h2>
                <div class="forecast-container" id="forecast-container">
                    <!-- Forecast items injected via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Lucide Icons JS -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Application JS -->
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
