pluginManagement {
    repositories {
        google()
        // Google-hosted Maven Central mirror first (Central rate-limits shared CI egress).
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Google-hosted Maven Central mirror first (Central rate-limits shared CI egress).
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = "NWSLocalWeather"
include ':app'
